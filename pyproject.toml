[build-system]
requires = [
    "setuptools>=69",
    "setuptools-rust>=1.12",
    "packaging>=24.1",
    "wheel",
    "pybind11"
    ]
build-backend = "setuptools.build_meta"

[project]
name = "openglider"
description = "OpenGlider"
requires-python = ">=3.11"
readme = {file = "README.md", content-type = "text/markdown"}
license = "GPL-3.0-or-later"
authors = [
    {name = "airG products", email = "simon@airg.family"},
]
keywords = ["paraglider", "flying"]
classifiers = [
    "Programming Language :: Python :: 3",
]
dynamic = ["version"]

dependencies = [
    "pandas",
    "pydantic",
    "svgwrite",
    "numpy",
    "scipy",
    "odfdo",
    "lxml",
    "packaging",
    "reportlab",
    "svglib",
]

[project.optional-dependencies]
gui = [
    "qtpy",
    "pyside6",
    "qtawesome",
    "qasync",
    "qtmodern",
    "qtconsole",
    "debugpy",
    "pyqtgraph",
    "matplotlib",
    "vtk",
]

[project.scripts]
openglider = "openglider.gui:start_main_window"

[project.urls]
Homepage = "https://www.openglider.org"
Repository = "https://github.com/hiaselhans/OpenGlider"

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "openglider.version.__version__"}

[tool.setuptools.package-data]
openglider = [
    "py.typed",
    "*.pyi",
    "rs/*.pyi",
    "**/*.csv",
    "**/*.svg",
    "**/*.png",
    "**/*.qss",
    "**/*.ods",
    "**/*.dat",
    "**/*.json",
]

[tool.setuptools.packages.find]
include = ["openglider*"]
exclude = ["*.tests", "*.tests.*"]

[tool.setuptools-rust]
[[tool.setuptools-rust.ext-modules]]
target = "openglider.rs"
path = "Cargo.toml"
binding = "PyO3"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
