name: Build Desktop Artifacts

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_name: windows-exe
            build_script: ./scripts/build_windows_exe.sh
            artifact_name: OpenGlider-windows-exe.zip
            artifact_path: dist/OpenGlider-windows.zip
          - os: macos-15-intel
            target_name: macos-app-x64
            build_script: ./scripts/build_macos_app.sh
            artifact_name: OpenGlider-macos-app-x64.tar.gz
            artifact_path: dist/OpenGlider-macos-app-x64.tar.gz
          - os: macos-15
            target_name: macos-app-arm64
            build_script: ./scripts/build_macos_app.sh
            artifact_name: OpenGlider-macos-app-arm64.tar.gz
            artifact_path: dist/OpenGlider-macos-app-arm64.tar.gz
          - os: ubuntu-latest
            target_name: linux-appimage-x64
            build_script: ./scripts/build_linux_appimage.sh
            artifact_name: OpenGlider-linux-appimage-x64.AppImage
            artifact_path: dist/OpenGlider-linux-x86_64.AppImage
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Build desktop artifact
        shell: bash
        run: ${{ matrix.build_script }}

      - name: Archive Windows application folder
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/OpenGlider -DestinationPath dist/OpenGlider-windows.zip -Force

      - name: Archive macOS app bundle
        if: runner.os == 'macOS'
        env:
          ASSET_PATH: ${{ matrix.artifact_path }}
        shell: bash
        run: |
          tar -C dist -czf "$ASSET_PATH" OpenGlider.app

      - name: Upload artifact to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          ASSET_PATH: ${{ matrix.artifact_path }}
          ASSET_NAME: ${{ matrix.artifact_name }}
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" "$ASSET_PATH#$ASSET_NAME" --clobber
